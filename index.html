#polls tr:hover{background:#fff}
#polls td{padding:4px;border-top:1px dotted var(--line);text-align:right}
#polls td:first-child{text-align:left}
#wire ol{list-style:none;margin:6px 0 0;padding:0}
#wire li{padding:4px 0;border-top:1px dotted var(--line)}
#wire li .sub{margin:0 4px 0 0;display:inline}
#card q{display:block;margin:6px 0;padding:4px 8px;border-left:3px solid var(--line);font-style:italic;color:#3b4046}
#card q:before,#card q:after{content:none}
#card table.why{width:100%;border-collapse:collapse;margin:4px 0;font-variant-numeric:tabular-nums}
#card table.why td{padding:2px 0;border-top:1px dotted var(--line)}
#card table.why td+td{text-align:right}
#card ul.tips{margin:6px 0 0;padding-left:16px}
#card ul.tips li{border:0;padding:1px 0}
.meter u{position:absolute;left:50.1%;top:0;bottom:0;width:2px;background:var(--ink)}
.vote{cursor:pointer}
#news{cursor:pointer}
#news:hover span{text-decoration:underline}
#ledger .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px dotted var(--line)}
#steps{position:absolute;top:10px;left:10px;max-width:calc(100% - 20px);padding:4px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#steps span{color:var(--muted)}
#overlay{position:absolute;inset:0;background:rgba(40,45,52,.55);display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow:auto;z-index:6;box-sizing:border-box}
.contract{margin:auto;background:var(--paper);color:#2b2318;border:1px solid #5a4a2a;max-width:560px;padding:16px 22px;font-size:13.5px;line-height:1.4;position:relative;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.contract:before{content:"";position:absolute;inset:5px;border:1px solid #8a7a55;pointer-events:none}
.contract h1{font-size:19px;margin:0 0 4px;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.contract .sub{text-align:center;font-size:12px;color:#5a4a2a;margin-bottom:12px}
.contract p{margin:0 0 8px;max-width:62ch}
.contract ol{margin:0 0 10px;padding-left:22px}
.contract li{margin-bottom:4px}
.contract .stamp{display:inline-block;border:3px double #a33;color:#a33;padding:2px 8px;transform:rotate(-6deg);font-weight:700;letter-spacing:.1em;margin:4px 0 8px}
.contract .fig{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid #8a7a55;border-bottom:1px solid #8a7a55;padding:8px 0;margin:8px 0}
.contract .fig div{display:flex;flex-direction:column}
.contract .fig b{font-size:20px;font-variant-numeric:tabular-nums}
.contract .fig span{font-size:11px;color:#5a4a2a;text-transform:uppercase;letter-spacing:.08em}
.contract .btn{background:#fffdf7;border-color:#5a4a2a;color:#2b2318;box-shadow:none}
.contract .btn.main{background:#2b2318;color:#fffdf7}
#news{grid-column:1/-1;padding:5px 10px;display:flex;gap:10px;min-width:0;align-items:baseline}
#news b{color:#fff;background:var(--warn);padding:1px 6px;font-size:10.5px;letter-spacing:.14em;flex:none}
#news span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage.sec #scroll{top:46px;bottom:var(--dock,10px)}
#stage.sec #hint{right:10px;max-width:none;height:calc(var(--dock) - 20px);overflow:auto}
#stage.sec #hint.withlog{right:330px}
#stage.sec #readout{height:calc(var(--dock) - 20px);max-height:none}
#hint .pl{margin-top:3px}
#hint .strata{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
#hint .strata span{padding:0 5px;border:1px solid var(--line);background:#fff;font-size:11.5px}
#hint .strata .g{font-style:italic;color:var(--muted)}
#hint .strata .u{color:var(--muted);background:#e3e5e8}
#hint .strata .b{color:var(--warn)}
#hint .grp{display:inline-flex;gap:3px;align-items:center;margin:2px 10px 2px 0}
#hint .grp .btn{padding:1px 7px;font-size:12px}
#readout{position:absolute;right:10px;bottom:10px;width:310px;max-width:calc(100% - 20px);background:var(--paper);color:#2b2318;border:1px solid #5a4a2a;padding:8px 10px;box-sizing:border-box;font:11.5px/1.4 "Courier New",monospace;max-height:40%;overflow:auto;white-space:pre-wrap}
@media (max-width:820px){ #app{grid-template:auto minmax(0,1fr) auto auto / minmax(0,1fr)} #top{grid-row:1} #stage{grid-row:2} #pal{grid-row:3;flex-direction:row;overflow-x:auto} #news{grid-row:4} #pal h3{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 4px;flex:none;align-self:stretch;text-align:center} #pal .it{flex:none;width:auto;flex-direction:column;min-width:68px;text-align:center;padding:4px 4px 3px 7px} .it span{align-items:center} #steps{font-size:11px} }

</head>
