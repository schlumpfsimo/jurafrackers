<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style>
<title>Jura Frackers: Bore Again</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: flat light chrome in the spirit of a 1990s office application: square panels, one-pixel bevels,
   Helvetica. The isometric block floats on a light stage. Pixel font only on the canvases. */
:root{
  color-scheme:light;
  --bg:#dfe3e8; --panel:#f2f3f5; --ink:#15181c; --muted:#5b6670; --line:#8a9099; --hi:#ffffff; --lo:#6b7279; --lo2:#3b4046;
  --accent:#1f5fa8; --warn:#b3261e; --ok:#1f7a3f; --paper:#f1e6c8; --stage:#eef0f2;
  --px:"Pixelify Sans","Courier New",monospace; --ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 var(--ui)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;box-sizing:border-box;display:grid;grid-template:auto minmax(0,1fr) auto / 214px minmax(0,1fr);gap:8px;padding-block:8px;padding-inline:16px}
.box{background:var(--panel);border:1px solid var(--lo2);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
#top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px}
.title{font:700 22px/1 var(--px);letter-spacing:.02em;padding-right:8px;color:var(--ink);text-shadow:2px 2px 0 #f2c230}
.title small{display:block;font:700 9.5px/1 var(--ui);letter-spacing:.3em;color:var(--accent);margin-top:4px;text-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--lo);background:#fff;box-shadow:inset 1px 1px 0 #cfd4d9;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-size:14px}
.chip.neg b,.neg{color:var(--warn)} .pos{color:var(--ok)}
.chip button,.sp button,.btn,.it{border:1px solid var(--lo2);background:var(--panel);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);border-radius:0}
.chip button{padding:0 7px;line-height:17px;font-size:12px}
.sp{display:flex;gap:3px}
.sp button{padding:3px 9px;font-weight:700;min-width:30px}
.sp button[aria-pressed="true"],.it[aria-pressed="true"],.btn[aria-pressed="true"]{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);background:#e2e5e9}
.btn{padding:4px 10px;font-weight:600}
.btn:active,.sp button:active{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.btn.main{background:var(--ink);color:#fff;border-color:#000;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}
.vote{display:flex;flex-direction:column;flex:1 1 180px;min-width:160px;gap:2px}
.vote label{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.vote label b{color:var(--ink);font-size:14px}
.bar{position:relative;height:12px;border:1px solid var(--lo2);background:#e9d8d4;box-shadow:inset 1px 1px 0 #c9bcb8}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
.bar u{position:absolute;left:50.1%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}
#pal{overflow:auto;padding:6px;min-height:0;display:flex;flex-direction:column;gap:2px}
#pal h3{align-self:flex-start;margin:10px 2px 3px;padding:2px 7px 1px;font:700 10.5px/1.3 var(--ui);letter-spacing:.12em;text-transform:uppercase;color:#fff;background:var(--g);box-shadow:2px 2px 0 var(--lo2)}
#pal h3:first-child{margin-top:2px}
#pal .it{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);margin:2px 4px 4px 2px;text-align:left;padding:3px 6px 3px 10px;border:0;background:#fff;
  box-shadow:-2px 0 0 var(--lo2),2px 0 0 var(--lo2),0 -2px 0 var(--lo2),0 2px 0 var(--lo2),inset 5px 0 0 var(--g),4px 4px 0 rgba(0,0,0,.14);transition:transform .08s}
#pal .it:hover{transform:translate(-1px,-1px)}
#pal .it[aria-pressed="true"]{background:#fff3c4;transform:translate(2px,2px);box-shadow:-2px 0 0 var(--lo2),2px 0 0 var(--lo2),0 -2px 0 var(--lo2),0 2px 0 var(--lo2),inset 5px 0 0 var(--g)}
.it canvas{width:36px;height:36px;image-rendering:pixelated;flex:none;background:#cfe9f7;box-shadow:0 0 0 1px var(--lo2)}
.it span{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.it b{font-size:12.5px}
.it small{color:var(--muted);font-size:10.5px}
.it.off{opacity:.5}
.it .lock{color:var(--warn)}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(#f6f8fa,#dbe1e7);display:flex;align-items:center;justify-content:center}
#scroll{position:absolute;inset:0;overflow:auto;display:flex}
#game{margin:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:crosshair;touch-action:none}
.pane{position:absolute;box-sizing:border-box;padding:9px 11px;background:var(--panel);border:1px solid var(--lo2);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),3px 3px 0 rgba(0,0,0,.15);max-height:calc(100% - 20px);overflow:auto}
.pane h4{margin:0 22px 2px 0;font-size:14px;padding-bottom:3px;border-bottom:1px solid var(--line)}
#card{top:10px;right:10px;width:300px;max-width:calc(100% - 20px)}
#card .sub,.sub{color:var(--muted);font-size:11.5px;margin-bottom:6px}
.x{position:absolute;top:3px;right:4px;border:1px solid var(--lo2);background:var(--panel);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);font-size:13px;line-height:14px;padding:0 5px;font-weight:700}
#card ul{list-style:none;margin:6px 0;padding:0}
#card li{padding:2px 0;border-top:1px dotted var(--line)}
.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.meter{height:9px;border:1px solid var(--lo2);background:#e9d8d4;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ok)}
#hint{position:absolute;left:10px;bottom:10px;max-width:min(62%,620px);box-sizing:border-box;padding:5px 10px;background:rgba(242,243,245,.96);border:1px solid var(--lo2);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);font-size:12.5px}
#toast{position:absolute;top:10px;left:50%;transform:translateX(-50%);max-width:calc(100% - 20px);box-sizing:border-box;padding:5px 12px;background:#fff;border:1px solid var(--warn);color:var(--warn);font-weight:700;text-align:center}
#uncutbtn{position:absolute;right:10px;bottom:10px;z-index:1}
#zoombar{position:absolute;right:10px;bottom:46px;display:flex;flex-direction:column;gap:4px;z-index:1}
#zoombar .btn{width:30px;padding:2px 0;font-size:16px;font-weight:700}
#zoombar.sec [data-a^="cut"]{display:none}
#stage.sec #zoombar{bottom:calc(var(--dock,10px) + 10px)}
#viewbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center}
#viewbar span{font-weight:700;padding:0 4px}
#loans{top:10px;left:10px;width:330px;max-width:calc(100% - 20px);z-index:2}
#loans table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;margin:6px 0}
#loans td,#loans th{padding:2px 4px;border-top:1px dotted var(--line);text-align:right;font-weight:400}
#loans td:first-child,#loans th:first-child{text-align:left}
#research,#polls,#wire,#camp,#ledger{top:10px;left:10px;width:340px;max-width:calc(100% - 20px);z-index:2}
.trend{width:100%;height:auto;display:block;margin:2px 0 8px;font:9px Helvetica,Arial,sans-serif}.trend .hv line{opacity:0}.trend .hv:hover line{opacity:1}.trend .hv:hover rect.b{opacity:.8}.lg{display:flex;gap:10px;font-size:11px;color:var(--muted)}.lg i{display:inline-block;width:10px;height:2px;vertical-align:middle;margin-right:4px}
#ledger table.acc{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
#ledger td{padding:2px 0;border-top:1px dotted var(--line)}
#ledger td+td{text-align:right}
#ledger ol.dec{list-style:none;margin:4px 0 0;padding:0}
#ledger ol.dec li{padding:4px 0;border-top:1px dotted var(--line)}
#camp .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px dotted var(--line)}
.letter{max-width:520px}
.letter h1{text-align:left;text-transform:none;font-size:20px}
.choices{display:flex;flex-direction:column;gap:6px;margin-top:10px}
.choices .btn{display:flex;flex-direction:column;align-items:flex-start;text-align:left;padding:6px 10px}
.choices .btn span{font-weight:400;font-size:11.5px;opacity:.85}
#card .wish{margin:6px 0;padding:5px 8px;background:#fff6d6;border:1px solid #d9c27a}
#card .wish .btn{margin-top:4px}
#polls table{width:100%;border-collapse:collapse;margin-top:6px;font-variant-numeric:tabular-nums}
#polls tr{cursor:pointer}
#polls tr:hover{background:#fff}
#polls td{padding:4px;border-top:1px dotted var(--line);text-align:right}
#polls td:first-child{text-align:left}
#wire ol{list-style:none;margin:6px 0 0;padding:0}
#wire li{padding:4px 0;border-top:1px dotted var(--line)}
#wire li .sub{margin:0 4px 0 0;display:inline}
#card q{display:block;margin:6px 0;padding:4px 8px;border-left:3px solid var(--line);font-style:italic;color:#3b4046}
#card q:before,#card q:after{content:none}
#card table.why{width:100%;border-collapse:collapse;margin:4px 0;font-variant-numeric:tabular-nums}
#card table.why td{padding:2px 0;border-top:1px dotted var(--line)}
#card table.why td+td{text-align:right}
#card ul.tips{margin:6px 0 0;padding-left:16px}
#card ul.tips li{border:0;padding:1px 0}
.meter u{position:absolute;left:50.1%;top:0;bottom:0;width:2px;background:var(--ink)}
.vote{cursor:pointer}
#news{cursor:pointer}
#news:hover span{text-decoration:underline}
#research .row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:5px 0;border-top:1px dotted var(--line)}
#steps{position:absolute;top:10px;left:10px;max-width:calc(100% - 20px);padding:4px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#steps span{color:var(--muted)}
#overlay{position:absolute;inset:0;background:rgba(40,45,52,.55);display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow:auto;z-index:3;box-sizing:border-box}
.contract{margin:auto;background:var(--paper);color:#2b2318;border:1px solid #5a4a2a;max-width:560px;padding:16px 22px;font-size:13.5px;line-height:1.4;position:relative;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.contract:before{content:"";position:absolute;inset:5px;border:1px solid #8a7a55;pointer-events:none}
.contract h1{font-size:19px;margin:0 0 4px;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.contract .sub{text-align:center;font-size:12px;color:#5a4a2a;margin-bottom:12px}
.contract p{margin:0 0 8px;max-width:62ch}
.contract ol{margin:0 0 10px;padding-left:22px}
.contract li{margin-bottom:4px}
.contract .stamp{display:inline-block;border:3px double #a33;color:#a33;padding:2px 8px;transform:rotate(-6deg);font-weight:700;letter-spacing:.1em;margin:4px 0 8px}
.contract .fig{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid #8a7a55;border-bottom:1px solid #8a7a55;padding:8px 0;margin:8px 0}
.contract .fig div{display:flex;flex-direction:column}
.contract .fig b{font-size:20px;font-variant-numeric:tabular-nums}
.contract .fig span{font-size:11px;color:#5a4a2a;text-transform:uppercase;letter-spacing:.08em}
.contract .btn{background:#fffdf7;border-color:#5a4a2a;color:#2b2318;box-shadow:none}
.contract .btn.main{background:#2b2318;color:#fffdf7}
#news{grid-column:1/-1;padding:5px 10px;display:flex;gap:10px;min-width:0;align-items:baseline}
#news b{color:#fff;background:var(--warn);padding:1px 6px;font-size:10.5px;letter-spacing:.14em;flex:none}
#news span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#stage.sec #scroll{top:46px;bottom:var(--dock,10px)}
#stage.sec #hint{right:10px;max-width:none;height:calc(var(--dock) - 20px);overflow:auto}
#stage.sec #hint.withlog{right:330px}
#stage.sec #readout{height:calc(var(--dock) - 20px);max-height:none}
#hint .pl{margin-top:3px}
#hint .strata{display:flex;flex-wrap:wrap;gap:3px;margin:4px 0}
#hint .strata span{padding:0 5px;border:1px solid var(--line);background:#fff;font-size:11.5px}
#hint .strata .g{font-style:italic;color:var(--muted)}
#hint .strata .u{color:var(--muted);background:#e3e5e8}
#hint .strata .b{color:var(--warn)}
#hint .grp{display:inline-flex;gap:3px;align-items:center;margin:2px 10px 2px 0}
#hint .grp .btn{padding:1px 7px;font-size:12px}
#readout{position:absolute;right:10px;bottom:10px;width:310px;max-width:calc(100% - 20px);background:var(--paper);color:#2b2318;border:1px solid #5a4a2a;padding:8px 10px;box-sizing:border-box;font:11.5px/1.4 "Courier New",monospace;max-height:40%;overflow:auto;white-space:pre-wrap}
@media (max-width:820px){ #app{grid-template:auto minmax(0,1fr) auto auto / minmax(0,1fr)} #top{grid-row:1} #stage{grid-row:2} #pal{grid-row:3;flex-direction:row;overflow-x:auto} #news{grid-row:4} #pal h3{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 4px;flex:none;align-self:stretch;text-align:center} #pal .it{flex:none;width:auto;flex-direction:column;min-width:68px;text-align:center;padding:4px 4px 3px 7px} .it span{align-items:center} #steps{font-size:11px} }
</style>
</head>
<body>
<div id="app">
  <header id="top" class="box">
    <div class="title">Jura Frackers<small>BORE AGAIN</small></div>
    <div class="chip" id="cashc">Cash <b id="cash">400k</b></div>
    <div class="chip">Credit <b id="debt">0k</b><button id="loanbtn" title="Loans, in the Office panel">Loans</button></div><div class="chip"><button id="ledgerbtn" title="Finance, section readings, decisions, your buildings">Office</button></div><div class="chip" id="campchip" hidden><button id="campbtn" title="The campaign before the vote">Campaign</button></div>
    <div class="chip">Month <b id="net">&nbsp;</b></div>
    <div class="chip"><b id="date">Jan, year 1</b><small id="left"></small></div>
    <div class="sp" role="group" aria-label="Speed"><button id="sp0" title="Pause (space)">II</button><button id="sp05" title="Half speed">&frac12;</button><button id="sp1" title="Normal speed">&#9654;</button><button id="sp4">&#9654;&#9654;</button><button id="mute" title="Sound">&#9834;</button></div>
    <div class="vote" id="votebtn" role="button" tabindex="0" title="Open the polls"><label>Vote forecast <b id="fc">40.0%</b> yes &middot; needs 50.1%</label><div class="bar"><i id="fcfill"></i><u></u></div></div>
  </header>
  <nav id="pal" class="box" aria-label="Objects"></nav>
  <main id="stage" class="box">
    <div id="scroll"><canvas id="game" width="480" height="270"></canvas></div>
    <div id="viewbar" hidden><button class="btn" data-a="map">&larr; Block</button><button class="btn" data-a="secprev" title="Previous line ([)">&#9664;</button><span id="linename"></span><button class="btn" data-a="secnext" title="Next line (])">&#9654;</button><button class="btn" data-a="toggle" id="togglebtn">1970s paper</button></div>
    <aside id="card" class="pane" hidden></aside>
    <aside id="loans" class="pane" hidden></aside>
    <aside id="research" class="pane" hidden></aside>
    <aside id="polls" class="pane" hidden></aside>
    <aside id="wire" class="pane" hidden></aside>
    <aside id="camp" class="pane" hidden></aside>
    <aside id="ledger" class="pane" hidden></aside>
    <aside id="steps" class="pane" hidden></aside>
    <pre id="readout" hidden></pre>
    <div id="zoombar" hidden><button class="btn" data-a="cutup" title="Cut one line further north ([)" aria-label="Previous line">&#9650;</button><button class="btn" data-a="cutdown" title="Cut one line further south (])" aria-label="Next line">&#9660;</button><button class="btn" data-a="zin" title="Zoom in" aria-label="Zoom in">+</button><button class="btn" data-a="zout" title="Zoom out" aria-label="Zoom out">&minus;</button></div>
    <button class="btn" id="uncutbtn" data-a="uncut" hidden title="Show the whole block (Esc)">&times; Close cut</button>
    <div id="hint" hidden></div>
    <div id="toast" hidden></div>
    <div id="overlay"></div>
  </main>
  <footer id="news" class="box"><b>WIRE</b><span id="newsline">The canton signs. The valley has not been asked.</span></footer>
</div>
<script>
(() => {
'use strict';
/* ================================================================== config (every balance number lives here) */
const CFG = {
  MW:320, MH:200, SW:720, SH:405, HOR:4, UGH:500, MPX:35, DEPTH:95,        // map px, section px; 1 map px = 25 m across, 1 section px = 10 m down
  NLINES:7, LINE_Y0:26, LINE_DY:26, LEGACY_P:0.6,
  MONTH_SEC:40, END:120, START_CASH:30000, START_MOOD:40,
  LOAN_STEP:5000, LOAN_RATE:0.05, LOAN_TERM:96, CREDIT_BASE:15000, CREDIT_ASSET:0.6, CREDIT_INCOME:24, RED_LIMIT:8,
  SURVEY_K:4, PASS2_K:12, PASS3_K:20, SURVEY_SPEED:100,                           // k per 100 m; map px per month
  PIPE_K:150, LINE_K:30, PIPE_MAX:200, WINTER:1.5, HEAT_PRICE:0.09, POWER_PRICE:0.475,   // k CHF per MWh: heat net of heat-pump power, power at the federal feed-in tariff for petrothermal plants up to 5 MW (47.5 Rp./kWh)
  QUAKE_NEAR:-14, QUAKE_FAR:-5, QUAKE_MUTE:3, DRIFT:0.08
};
const DEF = {
  office:{g:'Company',n:'Local office',cost:300,up:20,build:1,bld:1,h:'Your seat in the valley and your membership of the geothermal association. Unlocks rigs, exploration wells, heat stations, pipes and fences, and the Office panel.'},
  experts:{g:'Company',n:'Expert container',cost:250,up:40,build:1,bld:1,near:'office',h:'Next to the office: a container of geologists and geophysicists. Unlocks the second pass and written readings of the sections, and the tracer test.'},
  engineers:{g:'Company',n:'Engineer compound',cost:600,up:60,build:2,bld:1,near:'office',h:'Next to the office: drilling engineers. Unlocks the deep rig, exploration wells to full depth, quiet upgrades, cement logs and squeezes.'},
  prhut:{g:'Company',n:'PR hut',cost:80,up:15,build:0.5,bld:1,near:'office',h:'Next to the office: local public relations. Unlocks police and every other force, fests, information stands and talking to protesters.'},
  lobby:{g:'Company',n:'Lobby outpost',cost:400,up:30,build:2,bld:1,h:'The association’s glass office for the whole valley. Unlocks the man in a suit, the congress, school funding and the campaign.'},
  workshop:{g:'Company',n:'Drilling workshop',cost:1500,up:50,build:6,bld:1,near:'engineers',h:'Next to the engineer compound. Every rig may bend its well up to 30°; brings the stimulation kit.'},
  waterlab:{g:'Company',n:'Water lab',cost:300,up:20,build:2,bld:1,h:'Samples every spring each week. Small traces are caught before anyone notices; unlocks the treatment plant.'},
  chair:{g:'Company',n:'University field station',cost:3000,up:80,build:12,bld:1,h:'A university chair with a field station. Unlocks the third pass, and its papers are friendlier.'},
  seisnet:{g:'Company',n:'Seismic network',cost:800,up:15,build:3,bld:1,h:'Seismometers around the valley, data published live. Quakes hurt mood less; unlocks the traffic-light stimulation and, with the workshop, the power plant.'},
  survey:{g:'Explore',n:'Survey line',c:'CHF 40k per km',h:'Click a grid line: a crew shoots 1.5 km around the click; click a surveyed stretch near one end to extend it. Three vibroseis trucks shake the ground; geophones record the echoes as a reflection section. It shows layer boundaries and breaks, not the rock itself.'},
  pass2:{g:'Explore',n:'Second pass',c:'CHF 120k per km',h:'Only with a university chair: a denser 3D array and reprocessing. Click a surveyed stretch to sharpen its reflection section.'},
  pass3:{g:'Explore',n:'Third pass',c:'CHF 200k per km',h:'The university reprocesses a stretch that had its second pass, with a 3D array. The readings then name the layers.'},
  testrig:{g:'Explore',n:'Exploration well',cost:3000,up:30,build:3,h:'A slim hole drilled as deep as your research allows (2,200 m, or 5,000 m with deep drilling). Cuttings and wireline logs name every layer and its temperature. Snaps to the nearest seismic line.'},
  light:{g:'Drill',n:'Light rig',cost:800,up:250,build:1,h:'Mobilisation CHF 800k; CHF 20k a day while drilling, CHF 250k a month standing idle. Reaches 2,200 m. Snaps to the nearest seismic line; anywhere goes, with consequences.'},
  deep:{g:'Drill',n:'Deep rig',cost:1800,up:500,build:2,need:'deep',h:'Mobilisation CHF 1.8 M; CHF 40k a day while drilling, CHF 500k a month standing idle. Reaches 5,000 m, into the granite.'},
