<title>Jura Frackers: Bore Again</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;600;700&display=swap">
<style>
/* Layout: flat light chrome in the spirit of a 1990s office application: square panels, one-pixel bevels,
   Helvetica. The isometric block floats on a light stage. Pixel font only on the canvases. */
:root{
  color-scheme:light;
  --bg:#dfe3e8; --panel:#f2f3f5; --ink:#15181c; --muted:#5b6670; --line:#8a9099; --hi:#ffffff; --lo:#6b7279; --lo2:#3b4046;
  --accent:#1f5fa8; --warn:#b3261e; --ok:#1f7a3f; --paper:#f1e6c8; --stage:#eef0f2;
  --px:"Pixelify Sans","Courier New",monospace; --ui:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:13px/1.35 var(--ui)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#app{height:100%;box-sizing:border-box;display:grid;grid-template:auto minmax(0,1fr) auto / 214px minmax(0,1fr);gap:8px;padding-block:8px;padding-inline:16px}
.box{background:var(--panel);border:1px solid var(--lo2);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo)}
#top{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 10px}
.title{font:700 22px/1 var(--px);letter-spacing:.02em;padding-right:8px;color:var(--ink);text-shadow:2px 2px 0 #f2c230}
.title small{display:block;font:600 10px/1 var(--px);letter-spacing:.3em;color:var(--accent);margin-top:4px;text-shadow:none}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border:1px solid var(--lo);background:#fff;box-shadow:inset 1px 1px 0 #cfd4d9;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font:600 15px/1 var(--px)}
.chip.neg b,.neg{color:var(--warn)} .pos{color:var(--ok)}
.chip button,.sp button,.btn,.it{border:1px solid var(--lo2);background:var(--panel);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);border-radius:0}
.chip button{padding:0 7px;line-height:17px;font-size:12px}
.sp{display:flex;gap:3px}
.sp button{padding:3px 9px;font:700 13px/1.2 var(--px);min-width:30px}
.sp button[aria-pressed="true"],.it[aria-pressed="true"],.btn[aria-pressed="true"]{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi);background:#e2e5e9}
.btn{padding:4px 10px;font-weight:600}
.btn:active,.sp button:active{box-shadow:inset 1px 1px 0 var(--lo),inset -1px -1px 0 var(--hi)}
.btn.main{background:var(--ink);color:#fff;border-color:#000;box-shadow:none}
.btn:disabled{opacity:.45;cursor:default}

.vote label{font-size:10.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.vote label b{color:var(--ink);font-size:14px}
.bar{position:relative;height:12px;border:1px solid var(--lo2);background:#e9d8d4;box-shadow:inset 1px 1px 0 #c9bcb8}

.bar u{position:absolute;left:50.1%;top:-3px;bottom:-3px;width:2px;background:var(--ink)}

#pal h3{align-self:flex-start;margin:10px 2px 3px;padding:2px 7px 1px;font:600 12px/1.2 var(--px);letter-spacing:.1em;text-transform:uppercase;color:#fff;background:var(--g);box-shadow:2px 2px 0 var(--lo2)}
#pal h3:first-child{margin-top:2px}
#pal .it{display:flex;align-items:center;gap:8px;width:calc(100% - 8px);margin:2px 4px 4px 2px;text-align:left;padding:3px 6px 3px 10px;border:0;background:#fff;
  box-shadow:-2px 0 0 var(--lo2),2px 0 0 var(--lo2),0 -2px 0 var(--lo2),0 2px 0 var(--lo2),inset 5px 0 0 var(--g),4px 4px 0 rgba(0,0,0,.14);transition:transform .08s}
#pal .it:hover{transform:translate(-1px,-1px)}
#pal .it[aria-pressed="true"]{background:#fff3c4;transform:translate(2px,2px);box-shadow:-2px 0 0 var(--lo2),2px 0 0 var(--lo2),0 -2px 0 var(--lo2),0 2px 0 var(--lo2),inset 5px 0 0 var(--g)}
.it canvas{width:36px;height:36px;image-rendering:pixelated;flex:none;background:#cfe9f7;box-shadow:0 0 0 1px var(--lo2)}
.it span{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.it b{font:600 13px/1.1 var(--px)}
.it small{color:var(--muted);font-size:10.5px}
.it.off{opacity:.5}
.it .lock{color:var(--warn)}
#stage{position:relative;min-width:0;min-height:0;overflow:hidden;background:linear-gradient(#f6f8fa,#dbe1e7);display:flex;align-items:center;justify-content:center}
#scroll{position:absolute;inset:0;overflow:auto;display:flex}
#game{margin:auto;image-rendering:pixelated;image-rendering:crisp-edges;display:block;cursor:crosshair;touch-action:none}
.pane{position:absolute;box-sizing:border-box;padding:9px 11px;background:var(--panel);border:1px solid var(--lo2);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo),3px 3px 0 rgba(0,0,0,.15);max-height:calc(100% - 20px);overflow:auto}

#card .sub,.sub{color:var(--muted);font-size:11.5px;margin-bottom:6px}
.x{position:absolute;top:3px;right:4px;border:1px solid var(--lo2);background:var(--panel);box-shadow:inset 1px 1px 0 var(--hi),inset -1px -1px 0 var(--lo);font-size:13px;line-height:14px;padding:0 5px;font-weight:700}

.acts{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.meter{height:9px;border:1px solid var(--lo2);background:#e9d8d4;position:relative;overflow:hidden}
.meter i{position:absolute;inset:0 auto 0 0;background:var(--ok)}

#uncutbtn{position:absolute;right:10px;bottom:10px;z-index:1}
#zoombar{position:absolute;right:10px;bottom:46px;display:flex;flex-direction:column;gap:4px;z-index:1}
#zoombar .btn{width:30px;padding:2px 0;font:700 16px/1.2 var(--px)}
#viewbar{position:absolute;top:10px;left:10px;display:flex;gap:6px;align-items:center}
#viewbar span{font-weight:700;padding:0 4px}

#steps{position:absolute;top:10px;left:10px;max-width:calc(100% - 20px);padding:4px 10px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#steps span{color:var(--muted)}
#overlay{position:absolute;inset:0;background:rgba(40,45,52,.55);display:flex;align-items:flex-start;justify-content:center;padding:12px;overflow:auto;z-index:3;box-sizing:border-box}
.contract{margin:auto;background:var(--paper);color:#2b2318;border:1px solid #5a4a2a;max-width:560px;padding:16px 22px;font-size:13.5px;line-height:1.4;position:relative;box-shadow:4px 4px 0 rgba(0,0,0,.25)}
.contract:before{content:"";position:absolute;inset:5px;border:1px solid #8a7a55;pointer-events:none}
.contract h1{font-size:19px;margin:0 0 4px;letter-spacing:.04em;text-transform:uppercase;text-align:center}
.contract .sub{text-align:center;font-size:12px;color:#5a4a2a;margin-bottom:12px}
.contract p{margin:0 0 8px;max-width:62ch}
.contract ol{margin:0 0 10px;padding-left:22px}
.contract li{margin-bottom:4px}
.contract .stamp{display:inline-block;border:3px double #a33;color:#a33;padding:2px 8px;transform:rotate(-6deg);font-weight:700;letter-spacing:.1em;margin:4px 0 8px}
.contract .fig{display:flex;gap:18px;flex-wrap:wrap;border-top:1px solid #8a7a55;border-bottom:1px solid #8a7a55;padding:8px 0;margin:8px 0}
.contract .fig div{display:flex;flex-direction:column}
.contract .fig b{font-size:20px;font-variant-numeric:tabular-nums}
.contract .fig span{font-size:11px;color:#5a4a2a;text-transform:uppercase;letter-spacing:.08em}
.contract .btn{background:#fffdf7;border-color:#5a4a2a;color:#2b2318;box-shadow:none}
.contract .btn.main{background:#2b2318;color:#fffdf7}
#news{grid-column:1/-1;padding:5px 10px;display:flex;gap:10px;min-width:0;align-items:baseline}
#news b{color:#fff;background:var(--warn);padding:1px 6px;font:600 11px/1.3 var(--px);letter-spacing:.14em;flex:none}
#news span{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#readout{position:absolute;right:10px;bottom:10px;width:300px;max-width:calc(100% - 20px);background:var(--paper);color:#2b2318;border:1px solid #5a4a2a;padding:8px 10px;box-sizing:border-box;font:11.5px/1.4 "Courier New",monospace;max-height:40%;overflow:auto;white-space:pre-wrap}
@media (max-width:820px){ #app{grid-template:auto minmax(0,1fr) auto auto / minmax(0,1fr)} #top{grid-row:1} #stage{grid-row:2} #pal{grid-row:3;flex-direction:row;overflow-x:auto} #news{grid-row:4} #pal h3{writing-mode:vertical-rl;transform:rotate(180deg);margin:0 4px;flex:none;align-self:stretch;text-align:center} #pal .it{flex:none;width:auto;flex-direction:column;min-width:68px;text-align:center;padding:4px 4px 3px 7px} .it span{align-items:center} #steps{font-size:11px} }
</style>
</head>
<body>

(() => {

const RNAME = ['topsoil','limestone','water-bearing karst','marl','dolomite','warm aquifer','fault zone','granite','hot granite'];
const RCOST = [3,3,3,3,6,3,4,7,7], RSPEED = [70,70,70,70,35,70,50,30,30], VEL = [-3, 1, -7, -1, 6, -6, -8, 8, -9];

/* ================================================================== helpers */
const $ = s => document.querySelector(s);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));

const lerp = (a,b,t) => a + (b-a)*t;
const m = px => Math.round(px*CFG.MPX);                            // map px -> metres
function rngFrom(seed){ let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hash(x,y,z,seed){ let h = (Math.imul(x|0,374761393) + Math.imul(y|0,668265263) + Math.imul(z|0,1274126177) + Math.imul(seed|0,144665)) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); h ^= h >>> 16; return (h >>> 0) / 4294967296; }

  return lerp(lerp(c(0,0),c(1,0),fx), lerp(c(0,1),c(1,1),fx), fy); }

/* ================================================================== sound (Web Audio, synthesised) */
let AC = null;
function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function sfx(k){ const ac = audio(); if (!ac || S.muted) return; const t0 = ac.currentTime, o = ac.createOscillator(), g = ac.createGain(); o.connect(g); g.connect(ac.destination);
  const env = (v, d) => { g.gain.setValueAtTime(v, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + d); o.start(t0); o.stop(t0 + d); };
  if (k === 'click'){ o.type = 'square'; o.frequency.setValueAtTime(880, t0); env(0.05, 0.06); }
  else if (k === 'coin'){ o.type = 'square'; o.frequency.setValueAtTime(660, t0); o.frequency.setValueAtTime(990, t0 + 0.08); env(0.08, 0.2); }
  else if (k === 'drill'){ o.type = 'sawtooth'; o.frequency.setValueAtTime(90, t0); o.frequency.linearRampToValueAtTime(60, t0 + 0.6); env(0.08, 0.7); }
  else if (k === 'quake'){ o.type = 'sawtooth'; o.frequency.setValueAtTime(40, t0); o.frequency.linearRampToValueAtTime(25, t0 + 1.2); env(0.25, 1.4); }
  else if (k === 'heli'){ o.type = 'square'; o.frequency.setValueAtTime(30, t0); env(0.12, 1.5); }
  else if (k === 'fire'){ o.type = 'sawtooth'; o.frequency.setValueAtTime(200, t0); o.frequency.exponentialRampToValueAtTime(50, t0 + 0.8); env(0.12, 0.9); }
  else if (k === 'jingle'){ o.type = 'square'; [523,659,784,1047].forEach((f,i) => o.frequency.setValueAtTime(f, t0 + i*0.12)); env(0.07, 0.6); }
  else if (k === 'no'){ o.type = 'square'; o.frequency.setValueAtTime(200, t0); o.frequency.setValueAtTime(150, t0 + 0.1); env(0.08, 0.25); }
}

function act(a, v){

function setZoom(z, cx, cy){ z = clamp(z, 1, 5); if (Math.abs(z - zoom) < 1e-3) return; const c = $('#game'), sc = $('#scroll'), r0 = c.getBoundingClientRect(), fx = (cx - r0.left)/r0.width, fy = (cy - r0.top)/r0.height;

  if (!keep){ const sc = $('#scroll'); sc.scrollLeft = (sc.scrollWidth - sc.clientWidth)/2; sc.scrollTop = (sc.scrollHeight - sc.clientHeight)/2; } }

/* ================================================================== loop and boot */
let bound = false, acc = 0;
function frame(now){
  const dt = Math.min(0.1, (now - lastT)/1000); lastT = now; const t = now/1000;
  if (running()){ advance(dt*S.speed/CFG.MONTH_SEC); tickEnts(dt); if (S.obj.some(o => o.drilling)){ acc += dt; if (acc > 1.4){ acc = 0; sfx('drill'); } } }
  const g = $('#game').getContext('2d'); g.imageSmoothingEnabled = false; if (view === 'map') drawMap(g, t); else drawSection(g, t); hud(); planBar();

}
